openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Theory of Change API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: portfolios
    description: Portfolio grouping operations
  - name: theories
    description: Theory of Change operations
  - name: components
    description: Theory of Change components
  - name: connections
    description: Component connections
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'

  /theories/{theoryId}/documents:
    get:
      operationId: listTheoryDocuments
      tags: [theories]
      summary: List documents for a theory
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TheoryDocument"
    post:
      operationId: createTheoryDocument
      tags: [theories]
      summary: Save document metadata after upload
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTheoryDocument"
      responses:
        "201":
          description: Document saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheoryDocument"

  /theories/{theoryId}/documents/{docId}:
    delete:
      operationId: deleteTheoryDocument
      tags: [theories]
      summary: Delete a document
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /portfolios:
    get:
      operationId: listPortfolios
      tags: [portfolios]
      summary: List all portfolios
      responses:
        "200":
          description: List of portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Portfolio"
    post:
      operationId: createPortfolio
      tags: [portfolios]
      summary: Create a new portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolio"
      responses:
        "201":
          description: Created portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  /portfolios/{id}:
    get:
      operationId: getPortfolio
      tags: [portfolios]
      summary: Get a portfolio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "404":
          description: Not found
    patch:
      operationId: updatePortfolio
      tags: [portfolios]
      summary: Update a portfolio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePortfolio"
      responses:
        "200":
          description: Updated portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
    delete:
      operationId: deletePortfolio
      tags: [portfolios]
      summary: Delete a portfolio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /program-logframe:
    get:
      operationId: getProgramLogframe
      tags: [portfolios]
      summary: Get aggregated logframe across all portfolios
      responses:
        "200":
          description: Program logframe with all portfolios and theories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramLogframe"

  /portfolios/{id}/logframe:
    get:
      operationId: getPortfolioLogframe
      tags: [portfolios]
      summary: Get aggregated logframe for a portfolio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Portfolio logframe with all theories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioLogframe"
        "404":
          description: Not found

  /theories:
    get:
      operationId: listTheories
      tags: [theories]
      summary: List all theories of change
      responses:
        "200":
          description: List of theories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Theory"
    post:
      operationId: createTheory
      tags: [theories]
      summary: Create a new theory of change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTheory"
      responses:
        "201":
          description: Created theory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Theory"

  /theories/{id}:
    get:
      operationId: getTheory
      tags: [theories]
      summary: Get a theory of change
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Theory details with components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheoryDetail"
        "404":
          description: Not found
    put:
      operationId: updateTheory
      tags: [theories]
      summary: Update a theory of change
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTheory"
      responses:
        "200":
          description: Updated theory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Theory"
    delete:
      operationId: deleteTheory
      tags: [theories]
      summary: Delete a theory of change
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /theories/{theoryId}/components:
    get:
      operationId: listComponents
      tags: [components]
      summary: List components for a theory
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Component"
    post:
      operationId: createComponent
      tags: [components]
      summary: Create a component in a theory
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponent"
      responses:
        "201":
          description: Created component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"

  /theories/{theoryId}/components/{id}:
    put:
      operationId: updateComponent
      tags: [components]
      summary: Update a component
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponent"
      responses:
        "200":
          description: Updated component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
    delete:
      operationId: deleteComponent
      tags: [components]
      summary: Delete a component
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /theories/{theoryId}/components/{componentId}/indicators:
    get:
      operationId: listComponentIndicators
      tags: [components]
      summary: List indicators for a component
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: componentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of indicators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComponentIndicator"
    post:
      operationId: createComponentIndicator
      tags: [components]
      summary: Create an indicator for a component
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: componentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentIndicator"
      responses:
        "201":
          description: Created indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentIndicator"

  /theories/{theoryId}/components/{componentId}/indicators/{id}:
    put:
      operationId: updateComponentIndicator
      tags: [components]
      summary: Update an indicator
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: componentId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentIndicator"
      responses:
        "200":
          description: Updated indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentIndicator"
    delete:
      operationId: deleteComponentIndicator
      tags: [components]
      summary: Delete an indicator
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: componentId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /theories/{theoryId}/connections:
    get:
      operationId: listConnections
      tags: [connections]
      summary: List connections between components
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
    post:
      operationId: createConnection
      tags: [connections]
      summary: Create a connection between components
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnection"
      responses:
        "201":
          description: Created connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"

  /theories/{theoryId}/connections/{id}:
    patch:
      operationId: updateConnection
      tags: [connections]
      summary: Update a connection (e.g. anchor points)
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnection"
      responses:
        "200":
          description: Updated connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
    delete:
      operationId: deleteConnection
      tags: [connections]
      summary: Delete a connection
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /theories/{theoryId}/business-model/actors:
    get:
      operationId: listBusinessModelActors
      tags: [business-model]
      summary: List business model actors
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of actors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessModelActor"
    post:
      operationId: createBusinessModelActor
      tags: [business-model]
      summary: Create a business model actor
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBusinessModelActor"
      responses:
        "201":
          description: Created actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessModelActor"

  /theories/{theoryId}/business-model/actors/{id}:
    put:
      operationId: updateBusinessModelActor
      tags: [business-model]
      summary: Update a business model actor
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBusinessModelActor"
      responses:
        "200":
          description: Updated actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessModelActor"
    delete:
      operationId: deleteBusinessModelActor
      tags: [business-model]
      summary: Delete a business model actor
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /theories/{theoryId}/business-model/generate-image:
    post:
      operationId: generateBusinessModelImage
      tags: [business-model]
      summary: Generate AI image for business model
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
              required:
                - prompt
      responses:
        "200":
          description: Generated image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateBusinessModelImageResponse"

  /theories/{theoryId}/risk-analyses:
    get:
      operationId: listTheoryRiskAnalyses
      tags: [theories]
      summary: List risk analyses for a theory
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of risk analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TheoryRiskAnalysis"
    post:
      operationId: createTheoryRiskAnalysis
      tags: [theories]
      summary: Create a risk analysis entry
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTheoryRiskAnalysis"
      responses:
        "201":
          description: Created risk analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheoryRiskAnalysis"

  /theories/{theoryId}/risk-analyses/{id}:
    patch:
      operationId: updateTheoryRiskAnalysis
      tags: [theories]
      summary: Update a risk analysis entry
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTheoryRiskAnalysis"
      responses:
        "200":
          description: Updated risk analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheoryRiskAnalysis"
    delete:
      operationId: deleteTheoryRiskAnalysis
      tags: [theories]
      summary: Delete a risk analysis entry
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /theories/{theoryId}/notes-updates:
    get:
      operationId: listTheoryNotesUpdates
      tags: [theories]
      summary: List notes and updates for a theory
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of notes and updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TheoryNoteUpdate"
    post:
      operationId: createTheoryNoteUpdate
      tags: [theories]
      summary: Create a note or update
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTheoryNoteUpdate"
      responses:
        "201":
          description: Created note/update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheoryNoteUpdate"

  /theories/{theoryId}/notes-updates/{id}:
    patch:
      operationId: updateTheoryNoteUpdate
      tags: [theories]
      summary: Update a note or update entry
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTheoryNoteUpdate"
      responses:
        "200":
          description: Updated note/update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheoryNoteUpdate"
    delete:
      operationId: deleteTheoryNoteUpdate
      tags: [theories]
      summary: Delete a note or update entry
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /theories/{theoryId}/systemic-changes/ai-analysis:
    post:
      operationId: analyzeSystemicChange
      tags: [theories]
      summary: Generate AI analysis of systemic change progress
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI-generated systemic change analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemicChangeAnalysis"

  /theories/{theoryId}/systemic-changes:
    get:
      operationId: listSystemicChanges
      tags: [theories]
      summary: List systemic change entries for a theory
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of systemic change entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemicChange"
    post:
      operationId: createSystemicChange
      tags: [theories]
      summary: Create a systemic change entry
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSystemicChange"
      responses:
        "201":
          description: Created systemic change entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemicChange"

  /theories/{theoryId}/systemic-changes/{id}:
    put:
      operationId: updateSystemicChange
      tags: [theories]
      summary: Update a systemic change entry
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSystemicChange"
      responses:
        "200":
          description: Updated systemic change entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemicChange"
    delete:
      operationId: deleteSystemicChange
      tags: [theories]
      summary: Delete a systemic change entry
      parameters:
        - name: theoryId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Theory:
      type: object
      properties:
        id:
          type: integer
        portfolioId:
          type: integer
          nullable: true
        title:
          type: string
        description:
          type: string
        market:
          type: string
        interventionCode:
          type: string
        interventionTitle:
          type: string
        manager:
          type: string
        mrmResponsible:
          type: string
        targetBeneficiary:
          type: string
        privateSectorPartners:
          type: string
        publicSectorPartners:
          type: string
        serviceProviders:
          type: string
        strategy:
          type: string
        interventionStory:
          type: string
        womenEconomicEmpowerment:
          type: string
        climateSmart:
          type: string
        displacement:
          type: string
        contributionOfOtherProjects:
          type: string
        businessModelImagePath:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - createdAt
        - updatedAt

    TheoryDetail:
      type: object
      properties:
        id:
          type: integer
        portfolioId:
          type: integer
          nullable: true
        title:
          type: string
        description:
          type: string
        market:
          type: string
        interventionCode:
          type: string
        interventionTitle:
          type: string
        manager:
          type: string
        mrmResponsible:
          type: string
        targetBeneficiary:
          type: string
        privateSectorPartners:
          type: string
        publicSectorPartners:
          type: string
        serviceProviders:
          type: string
        strategy:
          type: string
        interventionStory:
          type: string
        womenEconomicEmpowerment:
          type: string
        climateSmart:
          type: string
        displacement:
          type: string
        contributionOfOtherProjects:
          type: string
        strategyDocumentPath:
          type: string
        strategyDocumentName:
          type: string
        systemicChangeFramework:
          type: string
          nullable: true
        interventionStartYear:
          type: integer
          nullable: true
        interventionEndYear:
          type: integer
          nullable: true
        periodGranularity:
