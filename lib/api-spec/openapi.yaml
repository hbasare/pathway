        actualFigure:
          type: string
        actualExplanation:
          type: string
        actualSourceOfInformation:
          type: string
        actualDateLastReviewed:
          type: string
        actualNotes:
          type: string
        baselineDate:
          type: string
        baselineFigure:
          type: string
        baselineExplanation:
          type: string
        baselineSourceOfInformation:
          type: string
        baselineDateLastReviewed:
          type: string
        baselineNotes:
          type: string
        targetQualitativeQuestion:
          type: string
        targetQuantitativeQuestion:
          type: string
        actualQualitativeQuestion:
          type: string
        actualQuantitativeQuestion:
          type: string
        baselineQualitativeQuestion:
          type: string
        baselineQuantitativeQuestion:
          type: string
        calculationsNotes:
          type: string
        measurementFrequency:
          type: string
        scTarget:
          type: string
        scTargetNotes:
          type: string
        scActual:
          type: string
        scActualNotes:
          type: string
        scNotes:
          type: string
        position:
          type: integer
      required:
        - name

    UpdateComponentIndicator:
      type: object
      properties:
        name:
          type: string
        targetDate:
          type: string
        targetFigure:
          type: string
        targetExplanation:
          type: string
        targetSourceOfInformation:
          type: string
        targetDateLastReviewed:
          type: string
        targetNotes:
          type: string
        actualDate:
          type: string
        actualFigure:
          type: string
        actualExplanation:
          type: string
        actualSourceOfInformation:
          type: string
        actualDateLastReviewed:
          type: string
        actualNotes:
          type: string
        baselineDate:
          type: string
        baselineFigure:
          type: string
        baselineExplanation:
          type: string
        baselineSourceOfInformation:
