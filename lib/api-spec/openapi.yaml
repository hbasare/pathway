        targetFigure:
          type: string
          nullable: true
        targetExplanation:
          type: string
          nullable: true
        targetSourceOfInformation:
          type: string
          nullable: true
        targetDateLastReviewed:
          type: string
          nullable: true
        targetNotes:
          type: string
          nullable: true
        actualDate:
          type: string
          nullable: true
        actualFigure:
          type: string
          nullable: true
        actualExplanation:
          type: string
          nullable: true
        actualSourceOfInformation:
          type: string
