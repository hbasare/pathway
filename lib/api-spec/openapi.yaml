        baselineQualitativeQuestion:
          type: string
          nullable: true
        baselineQuantitativeQuestion:
          type: string
          nullable: true
        calculationsNotes:
          type: string
          nullable: true
        measurementFrequency:
          type: string
          nullable: true
        scTarget:
          type: string
          nullable: true
        scTargetNotes:
          type: string
          nullable: true
        scActual:
          type: string
          nullable: true
        scActualNotes:
          type: string
          nullable: true
        scNotes:
          type: string
          nullable: true
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - componentId
        - theoryId
        - name
        - position
        - createdAt
        - updatedAt

    CreateComponentIndicator:
      type: object
      properties:
        name:
          type: string
        targetDate:
          type: string
        targetFigure:
          type: string
        targetExplanation:
          type: string
        targetSourceOfInformation:
          type: string
        targetDateLastReviewed:
          type: string
        targetNotes:
